name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm test
      - run: npm run coverage:compile
      - run: npm run build
      - run: npm run test:native
